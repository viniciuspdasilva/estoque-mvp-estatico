<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque FastShop | Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar de Navegação -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-box-seam me-2"></i>FastShop Estoque
        </a>
        <div class="d-flex align-items-center gap-3">
            <form class="d-flex" role="search" onsubmit="event.preventDefault();">
                <input class="form-control form-control-sm me-2" type="search" placeholder="Buscar produto..." id="input-busca"
                       aria-label="Search">
            </form>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-light btn-sm" onclick="syncStockGlobal()" id="btn-refresh" type="submit"><i class="bi bi-arrow-clockwise"></i></button>
        </div>

    </div>
</nav>

<!-- Área de Conteúdo Principal -->
<main class="container my-5">

    <!-- Cabeçalho da Seção e Filtros -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-secondary" id="titulo-secao">Produtos Disponíveis</h2>

        <!-- Botões de Categoria (O JS pode gerar isso dinamicamente depois) -->
        <div class="btn-group" id="filtro-categorias" role="group" aria-label="Filtro de Categorias">
            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="filtrarPorCategoria('todos', this)">Todos</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="filtrarPorCategoria('electronics', this)">Eletrônicos</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="filtrarPorCategoria('clothing', this)">Roupas</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="filtrarPorCategoria('jewelery', this)">Joias</button>
        </div>
    </div>

    <!-- Grid onde os cards dos produtos serão injetados pelo JavaScript -->
    <div class="row g-4" id="vitrine-produtos"></div>

</main>
<!-- Modal de Edição Complexo -->
<div class="modal fade" id="modalEditarProduto" tabindex="-1" aria-labelledby="modalEditarProdutoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"> <!-- modal-lg para ficar mais largo -->
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title text-secondary" id="modalEditarProdutoLabel">
                    <i class="bi bi-pencil-square me-2"></i>Editar Produto: <span id="modal-titulo-nome" class="fw-bold text-dark"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <div class="modal-body">
                <form id="formEditarProduto">
                    <input type="hidden" id="edit-id" name="id">
                    <input type="hidden" id="edit-rating-rate" name="rating-rate">
                    <input type="hidden" id="edit-rating-count" name="rating-count">
                    <!-- Linha 1: Imagem + Nome + Preços -->
                    <div class="row mb-3">
                        <!-- Coluna da Imagem -->
                        <div class="col-md-4 text-center d-flex flex-column align-items-center justify-content-center">
                            <img id="edit-img-preview" src="" alt="Imagem do Produto" class="img-thumbnail mb-2" style="height: 150px; width: 100%; object-fit: contain;">
                            <button type="button" class="btn btn-sm btn-outline-secondary w-100">
                                <i class="bi bi-image"></i> Mudar
                            </button>
                        </div>

                        <!-- Coluna do Nome e Preços -->
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="edit-nome" class="form-label fw-bold">Nome do Produto</label>
                                <input type="text" class="form-control" id="edit-nome" required>
                            </div>

                            <div class="row">
                                <div class="col-6">
                                    <label for="edit-preco" class="form-label fw-bold">Preço Original</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" step="0.01" class="form-control" id="edit-preco" disabled>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label for="edit-preco-promo" class="form-label fw-bold text-success">Novo Preço</label>
                                    <div class="input-group">
                                        <span class="input-group-text text-success">R$</span>
                                        <input type="number" step="0.01" class="form-control border-success" id="edit-preco-promo">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Linha 2: Descrição -->
                    <div class="mb-3">
                        <label for="edit-desc" class="form-label fw-bold">Descrição Breve</label>
                        <textarea class="form-control" id="edit-desc" rows="2"></textarea>
                    </div>

                    <!-- Linha 3: Estoque + Categoria -->
                    <div class="row">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <label for="edit-estoque" class="form-label fw-bold">Estoque</label>
                            <input type="number" class="form-control" id="edit-estoque">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold d-block">Categoria</label>
                            <!-- Radios dinâmicos baseados no Fake Store -->
                            <div class="form-check form-check-inline mt-1">
                                <input class="form-check-input" type="radio" name="edit-categoria" id="cat-mens" value="men's clothing">
                                <label class="form-check-label" for="cat-mens">Masculino</label>
                            </div>
                            <div class="form-check form-check-inline mt-1">
                                <input class="form-check-input" type="radio" name="edit-categoria" id="cat-womens" value="women's clothing">
                                <label class="form-check-label" for="cat-womens">Feminino</label>
                            </div>
                            <div class="form-check form-check-inline mt-1">
                                <input class="form-check-input" type="radio" name="edit-categoria" id="cat-jewelery" value="jewelery">
                                <label class="form-check-label" for="cat-jewelery">Joias</label>
                            </div>
                            <div class="form-check form-check-inline mt-1">
                                <input class="form-check-input" type="radio" name="edit-categoria" id="cat-electronics" value="electronics">
                                <label class="form-check-label" for="cat-electronics">Eletrônicos</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="saveEdit()">Salvar Alterações</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Confirmação de Exclusão -->
<div class="modal fade" id="modalExcluirProduto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-danger">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Exclusão</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body text-center">
                <p class="fs-5 mb-4">Tem certeza que deseja remover este produto do estoque?</p>

                <!-- Mini card para exibir o produto que será apagado -->
                <div class="card mx-auto shadow-sm border-0 bg-light" style="max-width: 250px;">
                    <img id="del-img-preview" src="" class="card-img-top p-2 mx-auto" style="height: 120px; width: auto; object-fit: contain;" alt="Imagem">
                    <div class="card-body py-2">
                        <h6 class="card-title text-truncate mb-1" id="del-nome">Nome</h6>
                        <p class="card-text text-success fw-bold mb-0" id="del-preco">R$ 0,00</p>
                    </div>
                </div>

                <p class="text-muted mt-3 mb-0" style="font-size: 0.85rem;">Esta ação apagará o item do banco de dados permanentemente.</p>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" onclick="confirmarExclusao()">
                    <i class="bi bi-trash me-1"></i> Sim, Remover
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Container de Toasts flutuantes -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">

    <!-- Toast de Sucesso -->
    <div id="toastSucesso" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span id="toast-mensagem">Ação realizada com sucesso!</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>

</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Custom JS -->
<script src="src/js/api.js"></script>
<script src="src/js/index.js"></script>
</body>

</html>
