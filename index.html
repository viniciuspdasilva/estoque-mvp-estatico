<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque FastShop | Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar de Navegação -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-box-seam me-2"></i>FastShop Estoque
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="d-flex align-items-center gap-3">
                <form class="d-flex" role="search">
                    <input class="form-control form-control-sm me-2" type="search" placeholder="Buscar produto..."
                           aria-label="Search">
                    <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-search"></i></button>
                </form>

                <!-- Indicador visual do estoque local -->
                <button class="btn btn-primary btn-sm position-relative">
                    <i class="bi bi-inboxes"></i> Itens
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          id="contador-estoque">
                            0
                        </span>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Área de Conteúdo Principal -->
<main class="container my-5">

    <!-- Cabeçalho da Seção e Filtros -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-secondary" id="titulo-secao">Produtos Disponíveis</h2>

        <!-- Botões de Categoria (O JS pode gerar isso dinamicamente depois) -->
        <div class="btn-group" role="group" aria-label="Filtro de Categorias">
            <button type="button" class="btn btn-outline-secondary btn-sm active">Todos</button>
            <button type="button" class="btn btn-outline-secondary btn-sm">Eletrônicos</button>
            <button type="button" class="btn btn-outline-secondary btn-sm">Roupas</button>
        </div>
    </div>

    <!-- Grid onde os cards dos produtos serão injetados pelo JavaScript -->
    <div class="row g-4" id="vitrine-produtos"></div>

</main>
<div class="modal fade" id="modalEditarProduto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title text-secondary"><i class="bi bi-pencil-square me-2"></i>Editar Produto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="formEditarProduto">
                    <div class="mb-3">
                        <label for="edit-nome" class="form-label fw-bold">Nome do Produto</label>
                        <input type="text" class="form-control" id="edit-nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-preco" class="form-label fw-bold">Preço (R$)</label>
                        <input type="number" step="0.01" class="form-control" id="edit-preco" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="salvarEdicao()">Salvar Alterações</button>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Custom JS -->
<script src="src/js/api.js"></script>
<script src="src/js/index.js"></script>
</body>

</html>
